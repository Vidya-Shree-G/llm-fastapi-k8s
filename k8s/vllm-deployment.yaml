apiVersion: apps/v1
kind: Deployment

metadata:
  name: vllm

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vllm

  template:
    metadata:
      labels:
        app: vllm

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:latest-arm64
          imagePullPolicy: IfNotPresent

          args:
            - "Qwen/Qwen2.5-0.5B-Instruct"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--dtype"
            - "float32"
            - "--max-model-len"
            - "2048"
            - "--gpu-memory-utilization"
            - "0.5"

          env:
            - name: VLLM_PORT
              value: "8000"

          ports:
            - containerPort: 8000

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false

          resources:
            requests:
              cpu: "4"
              memory: "4Gi"
            limits:
              cpu: "8"
              memory: "8Gi"

          volumeMounts:
            - name: dshm
              mountPath: /dev/shm

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
