apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi
    spec:
      serviceAccountName: fastapi
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fastapi

          image: llm-fastapi:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: VLLM_URL
              value: "http://vllm:8000"
            - name: AUTH_MODE
              value: "oidc"
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: llm-fastapi-secrets
                  key: oidc_issuer
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: llm-fastapi-secrets
                  key: oidc_audience
            - name: OIDC_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: llm-fastapi-secrets
                  key: oidc_jwks_url
            - name: MAX_REQUESTS_PER_MINUTE
              value: "30"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

      automountServiceAccountToken: false
